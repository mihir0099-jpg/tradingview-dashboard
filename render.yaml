# Render 1-click build trigger
services:
  - type: web
    name: tradingview-dashboard
    env: node
    plan: free
    buildCommand: "cd backend && npm install"
    startCommand: "node backend/server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: TZ
        value: "Asia/Kolkata"
      # RENDER_EXTERNAL_URL is auto-set by Render — used by heartbeat engine to ping public URL
      # TRADINGVIEW_TOKEN — set manually in Render dashboard (secret, not committed to git)
