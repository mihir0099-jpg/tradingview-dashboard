# Render 1-click build trigger
services:
  - type: web
    name: tradingview-dashboard
    env: node
    plan: free
    buildCommand: "cd backend && npm install"
    startCommand: "node backend/server.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
