# Render 1-click build trigger
services:
  - type: web
    name: tradingview-dashboard
    env: node
    plan: free
    buildCommand: "cd backend && npm install && cd ../frontend && npm install --include=dev --legacy-peer-deps && npm run build"
    startCommand: "node backend/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
